<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laurenz Felix · Links</title>
<meta name="description" content="Resume, LinkedIn, contact, and engineering portfolio for Laurenz Felix, chemical engineering at UC Irvine.">
<meta name="theme-color" content="#050608">
<meta property="og:title" content="Laurenz Felix">
<meta property="og:description" content="Resume, LinkedIn, contact, and engineering portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* This page reads its text and links from ../content.js, the same file as the portfolio.
   Change your email, LinkedIn, or resume there and both pages update. */
:root {
  --bg: #050608; --surface: #0e1116; --surface-2: #151922; --ink: #eceef1; --muted: #8f949d; --line: #1f242d; --line-2: #2d333d;
  --silver: linear-gradient(172deg, #ffffff 0%, #e4e6ea 34%, #b3b8c0 66%, #81868f 100%);
  --silver-btn: linear-gradient(180deg, #f6f7f9 0%, #d3d6db 55%, #aeb3ba 100%);
  --display: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); font-family: var(--display); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1px 1px at 82% 9%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.4px 1.4px at 91% 34%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1px 1px at 6% 52%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.3px 1.3px at 94% 71%, rgba(200,215,255,.6), transparent 60%),
    radial-gradient(1px 1px at 9% 86%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1px 1px at 72% 94%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1px 1px at 30% 4%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(900px 520px at 50% -180px, rgba(160,170,190,.10), transparent 70%),
    var(--bg);
  background-attachment: fixed; }
main { width: min(460px, 100%); margin: 0 auto; padding: max(36px, env(safe-area-inset-top)) 20px max(30px, env(safe-area-inset-bottom)); display: grid; gap: 22px; }
.top { display: grid; justify-items: center; text-align: center; gap: 10px; }
.photo { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 1px solid rgba(255,255,255,.2); box-shadow: 0 0 0 5px rgba(255,255,255,.03), 0 14px 40px rgba(0,0,0,.6); margin-bottom: 6px; }
h1 { margin: 0; font-size: 2.1rem; font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; background: var(--silver); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pitch { margin: 2px 0 0; color: #c4c8cf; font-size: .98rem; line-height: 1.55; max-width: 34ch; }
.avail { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 10px; border-radius: 999px; border: 1px solid rgba(120,220,160,.28); background: rgba(80,200,130,.07); color: #bfeccf; font-family: var(--mono); font-size: .7rem; letter-spacing: .04em; }
.avail i { width: 7px; height: 7px; border-radius: 50%; background: #5fdc95; }
.links { display: grid; gap: 11px; }
a.l { display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 12px 16px; border-radius: 16px; border: 1px solid var(--line-2); background: rgba(14,17,22,.86); color: var(--ink); text-decoration: none; transition: transform .15s, border-color .15s, background .15s; }
a.l:hover { border-color: #4a515d; background: rgba(21,25,34,.95); }
a.l:active { transform: scale(.985); }
a.l:focus-visible { outline: 2px solid #cfd3d9; outline-offset: 3px; }
a.l .ic { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); }
a.l .ic svg { width: 19px; height: 19px; }
a.l .tx { display: grid; gap: 1px; flex: 1; min-width: 0; }
a.l b { font-weight: 550; font-size: 1.02rem; letter-spacing: -0.01em; }
a.l small { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.l .go { color: var(--muted); font-size: 1.1rem; }
a.l.primary { background: var(--silver-btn); color: #0b0c0f; border-color: transparent; box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.7); min-height: 70px; }
a.l.primary small, a.l.primary .go { color: #3d424b; }
a.l.primary .ic { background: rgba(11,12,15,.9); border-color: transparent; }
.label { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 2px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips a { padding: 9px 13px; border-radius: 999px; border: 1px solid var(--line-2); color: #d6d9de; text-decoration: none; font-size: .86rem; background: rgba(14,17,22,.7); }
.chips a:hover { border-color: #4a515d; }
footer { text-align: center; color: #5f646d; font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header class="top">
    <img class="photo" id="photo" src="../images/headshot.jpg" alt="Laurenz Felix" width="104" height="104">
    <span class="avail" id="avail"><i></i><span></span></span>
    <h1 id="name">Laurenz Felix</h1>
    <span class="sub" id="sub">UC Irvine · Class of 2028</span>
    <p class="pitch" id="pitch">Chemical engineering, specializing in energy and sustainability, with a materials science minor. I build rockets and spacecraft propulsion.</p>
  </header>

  <nav class="links" id="links" aria-label="Links"></nav>

  <div>
    <p class="label">Jump to a project</p>
    <div class="chips" id="chips"></div>
  </div>

  <footer><a href="../">laurenzf.github.io</a></footer>
</main>

<script src="../content.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const S = typeof SITE !== "undefined" ? SITE : {}, C = typeof CONTACT !== "undefined" ? CONTACT : { emails: [], links: [] };
  const F = typeof FEATURED !== "undefined" ? FEATURED : [];

  if (S.headline) $("name").textContent = S.headline;
  if (S.status) $("avail").lastElementChild.textContent = S.status; else $("avail").remove();
  if (typeof ABOUT !== "undefined" && ABOUT.photo) $("photo").src = "../" + ABOUT.photo;

  const icon = {
    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="#e9ebee" stroke-width="1.7"><path d="M5 19 19 5M9 5h10v10"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="#d6d9de" stroke-width="1.7"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
    in: '<svg viewBox="0 0 24 24" fill="#d6d9de"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.06c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.77 2.65 4.77 6.1V21h-4v-5.1c0-1.22-.02-2.78-1.7-2.78-1.7 0-1.96 1.33-1.96 2.7V21h-4z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="#d6d9de" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>',
    card: '<svg viewBox="0 0 24 24" fill="none" stroke="#d6d9de" stroke-width="1.7"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1.2-3.6 4-5 7-5s5.8 1.4 7 5"/><path d="M19 3v4M17 5h4"/></svg>',
    gh: '<svg viewBox="0 0 24 24" fill="#d6d9de"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.35 4.68-4.58 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>'
  };
  const findLink = name => (C.links || []).find(l => l[0].toLowerCase() === name);
  const li = findLink("linkedin"), gh = findLink("github");
  const mail = ((C.emails || []).find(e => /gmail/i.test(e[1])) || (C.emails || [])[0] || [])[1];

  const rows = [
    { cls: "primary", href: "../", ic: "globe", t: "View my portfolio", s: "Rockets, propulsion, rover, research" },
    S.resumeUrl && { href: "../" + S.resumeUrl, ic: "doc", t: "Resume", s: "One page, PDF", ext: true },
    li && { href: li[2], ic: "in", t: "LinkedIn", s: li[1], ext: true },
    mail && { href: "mailto:" + mail + "?subject=" + encodeURIComponent("Nice meeting you"), ic: "mail", t: "Email me", s: mail },
    { href: "../files/Laurenz_Felix.vcf", ic: "card", t: "Save my contact", s: "Adds me to your phone contacts", dl: true },
    gh && { href: gh[2], ic: "gh", t: "GitHub", s: gh[1], ext: true }
  ].filter(Boolean);
  $("links").innerHTML = rows.map(r => `<a class="l ${r.cls || ""}" href="${esc(r.href)}"${r.ext ? ' target="_blank" rel="noopener"' : ""}${r.dl ? " download" : ""}>
    <span class="ic">${icon[r.ic]}</span><span class="tx"><b>${esc(r.t)}</b><small>${esc(r.s)}</small></span><span class="go" aria-hidden="true">&rsaquo;</span></a>`).join("");

  $("chips").innerHTML = F.map(p => `<a href="../#${esc(p.id)}">${esc(p.short || p.title)}</a>`).join("");
})();
</script>
</body>
</html>
